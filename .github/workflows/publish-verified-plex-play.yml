name: Publish verified Plex Play release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v3.19.26
  RELEASE_VERSION: 3.19.26
  EXPECTED_APK_SHA256: cc23c431551d1ed128cda900a52c21cd5ecd3e143c6e5f653fc2a664778808bc
  SOURCE_RELEASE_URL: https://github.com/bluemirr8520-lgtm/plex-play-universal-updates/releases/download/plex-play-v3.19.26-build

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify signed APK
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL --retry 3 --retry-all-errors -o dist/PlexPlay.apk "$SOURCE_RELEASE_URL/PlexPlay.apk"
          curl -fL --retry 3 --retry-all-errors -o dist/PlexPlay.apk.sha256 "$SOURCE_RELEASE_URL/PlexPlay.apk.sha256"
          (
            cd dist
            sha256sum -c PlexPlay.apk.sha256
          )
          actual="$(sha256sum dist/PlexPlay.apk | awk '{print $1}')"
          test "$actual" = "$EXPECTED_APK_SHA256"
          test "$(wc -c < dist/PlexPlay.apk)" -gt 20000000

      - name: Publish Plex Play latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Plex Play v3.19.26

          - 세로 자막에서 ASCII 영문 한 글자는 기존처럼 세운 상태로 표시합니다.
          - 연속된 ASCII 영문 두 글자 이상은 단어 단위로 오른쪽 90도 회전합니다.
          - 회전 문자열의 실제 폭과 중심 위치를 계산해 앞뒤 글자 겹침을 방지합니다.
          - v3.19.25의 품질 변환 자막 중복 방지와 기존 재생 기능을 그대로 유지합니다.
          - 단위 테스트, APK 정렬, 패키지/버전, 기존 설치본과 동일한 서명 인증서, SHA-256 검증을 통과했습니다.

          SHA-256: `cc23c431551d1ed128cda900a52c21cd5ecd3e143c6e5f653fc2a664778808bc`
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/PlexPlay.apk dist/PlexPlay.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Plex Play v$RELEASE_VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" dist/PlexPlay.apk dist/PlexPlay.apk.sha256 --repo "$GITHUB_REPOSITORY" --title "Plex Play v$RELEASE_VERSION" --notes-file release-notes.md --latest
          fi
